<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spider Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,600;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* first light: an orb web at dawn */
    --sky-top: #161b38; --sky-mid: #231f45; --horizon: #3b2f57;
    --panel: #1a1f3d; --line: rgba(230, 227, 244, .09);
    --text: #eceaf7; --muted: #a3a6c4; --faint: #6f7396;
    --silk: #e6e3f4; --ok: #8fe3d1; --accent: #ffc46b;
    --err: #ff7d8c; --skip: #7d81a0;
    --serif: "Alegreya", Georgia, serif;
    --sans: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sky-top); color: var(--text);
    font: 15px/1.45 var(--sans); }
  .app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }

  #stage { position: relative; overflow: hidden;
    background:
      radial-gradient(120% 55% at 50% 108%, rgba(255, 196, 107, .2), transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--horizon) 100%); }
  canvas { display: block; width: 100%; height: 100%; }

  aside { background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }

  header { padding: 22px 24px 18px; }
  h1 { font: 500 24px/1.15 var(--serif); margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff 0 18%, var(--accent) 45%);
    box-shadow: 0 0 12px rgba(255, 196, 107, .7); animation: breathe 1.6s ease-in-out infinite; }
  .done .dot { background: radial-gradient(circle at 35% 30%, #fff 0 18%, var(--ok) 45%);
    box-shadow: 0 0 12px rgba(143, 227, 209, .6); animation: none; }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.8); } }
  .now { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    padding: 0 24px 18px; border-bottom: 1px solid var(--line); }
  .stat b { display: block; font: 600 26px/1.1 var(--serif); font-variant-numeric: lining-nums tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.err b { color: var(--err); }
  .stat.err.zero b { color: var(--text); }

  #feed { overflow-y: auto; flex: 1; min-height: 0; scrollbar-color: var(--faint) transparent; }
  #feed:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .entry { position: relative; padding: 14px 24px 14px 44px; border-bottom: 1px solid var(--line);
    animation: in .5s ease-out; }
  .entry::before { content: ""; position: absolute; left: 22px; top: 21px; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--ok) 45%); }
  .entry.err::before { background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--err) 45%); }
  .entry.skip::before { background: var(--skip); }
  .entry.skip { color: var(--muted); }
  @keyframes in { from { opacity: 0; background: rgba(255, 196, 107, .08); } }
  .entry .t { font: 500 17px/1.3 var(--serif); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.skip .t, .entry.err .t { font-style: italic; }
  .entry .u { color: var(--faint); font-size: 13px; word-break: break-all; margin-top: 1px; }
  .entry .m { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .entry .m b { color: var(--text); font-weight: 500; font-variant-numeric: lining-nums; }
  .entry .m .bad b { color: var(--err); }
  .entry .fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px;
    font-size: 13px; margin: 8px 0 0; }
  .entry dt { color: var(--accent); }
  .entry dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
  .entry .why { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .tip { position: absolute; pointer-events: none; display: none; max-width: 340px;
    background: rgba(26, 31, 61, .94); border: 1px solid rgba(230, 227, 244, .16);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
    box-shadow: 0 12px 30px rgba(8, 10, 30, .45); backdrop-filter: blur(6px); }
  .tip b { display: block; font: 500 16px/1.3 var(--serif); margin-bottom: 2px; }
  .tip span { color: var(--faint); word-break: break-all; }
  .tip em { display: block; font-style: normal; color: var(--muted); margin-top: 4px; }

  .legend { position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: var(--muted);
    display: flex; gap: 18px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .d-ok { background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--ok) 45%); }
  .legend .d-fetch { background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--accent) 45%); }
  .legend .d-queue { border: 1px solid var(--silk); opacity: .7; }
  .legend .d-err { background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--err) 45%); }
  .legend .d-skip { background: var(--skip); }

  .empty { color: var(--muted); font-size: 14px; padding: 18px 24px; max-width: 32ch; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    header { padding: 16px 16px 12px; }
    h1 { font-size: 20px; }
    .stats { padding: 0 16px 12px; gap: 8px; }
    .stat b { font-size: 21px; }
    .entry { padding: 12px 16px 12px 36px; }
    .entry::before { left: 16px; top: 19px; }
    .legend { left: 16px; gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, .entry { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="stage">
    <canvas id="c" aria-label="Live map of the pages the spider has found"></canvas>
    <div class="tip" id="tip"></div>
    <div class="legend">
      <span><i class="d-ok"></i>Extracted</span>
      <span><i class="d-fetch"></i>Fetching</span>
      <span><i class="d-queue"></i>Queued</span>
      <span><i class="d-err"></i>Error</span>
      <span><i class="d-skip"></i>Skipped</span>
    </div>
  </div>
  <aside id="side">
    <header>
      <h1><span class="dot"></span><span id="status">Spinning the web</span></h1>
      <div class="now" id="now">Waiting for the crawler to start</div>
    </header>
    <div class="stats">
      <div class="stat"><b id="sPages">0</b><span>Pages read</span></div>
      <div class="stat"><b id="sQueued">0</b><span>Waiting</span></div>
      <div class="stat err zero" id="sErrBox"><b id="sErrors">0</b><span>Errors</span></div>
      <div class="stat"><b id="sTime">0s</b><span>Elapsed</span></div>
    </div>
    <div id="feed" tabindex="0" aria-label="Pages read"><div class="empty">Each page shows up here with the data the spider pulled from it.</div></div>
  </aside>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue('--' + k).trim();
  const COL = { ok: C('ok'), err: C('err'), accent: C('accent'), skip: C('skip'), silk: C('silk'), muted: C('muted') };

  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1; W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  addEventListener('resize', resize); resize();

  // ---------- state ----------
  const nodes = new Map(), list = [], edges = [], recent = [];
  const events = [];
  const stats = { pages: 0, errors: 0 };
  let t0 = null, tEnd = null, finished = false, lastId = -1;
  const cam = { x: 0, y: 0, s: 1.6 };
  const spider = { x: 0, y: 0, ang: -Math.PI / 2, phase: 0, path: [], at: null, wait: 0, scanning: null };

  // ---------- stream ----------
  const es = new EventSource('/events');
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.id <= lastId) return;
    lastId = ev.id;
    events.push(ev);
    if (t0 === null) t0 = performance.now();
  };

  // ---------- graph ----------
  function addNode(url, parentUrl, depth) {
    if (nodes.has(url)) return nodes.get(url);
    const p = parentUrl ? nodes.get(parentUrl) : null;
    const a = Math.random() * Math.PI * 2, r = p ? 30 + Math.random() * 30 : (list.length ? 120 : 0);
    const n = { url, parent: p, depth, x: (p ? p.x : 0) + Math.cos(a) * r, y: (p ? p.y : 0) + Math.sin(a) * r,
      vx: 0, vy: 0, state: 'queued', born: performance.now(), pulse: 0, data: null, edge: null };
    nodes.set(url, n); list.push(n);
    if (p) { n.edge = { a: p, b: n, walked: false }; edges.push(n.edge); }
    return n;
  }

  function route(from, to) {
    if (!from) return [to];
    const anc = new Set(); for (let a = to; a; a = a.parent) anc.add(a);
    const up = []; let c = from;
    while (c && !anc.has(c)) { c = c.parent; if (c) up.push(c); }
    if (!c) return [to];
    const down = []; for (let a = to; a && a !== c; a = a.parent) down.unshift(a);
    return up.concat(down);
  }

  const backlog = () => { let b = 0; for (const e of events) if (e.type === 'fetch') b++; return b; };

  // ---------- event handling (sequential, waits for the spider) ----------
  function pump(now) {
    while (events.length) {
      if (spider.path.length || spider.wait > now) return;
      handle(events.shift(), now);
    }
  }

  function handle(ev, now) {
    switch (ev.type) {
      case 'queue': addNode(ev.url, ev.parent, ev.depth); break;
      case 'fetch': {
        const n = addNode(ev.url, ev.parent, ev.depth);
        n.state = 'fetching';
        $('now').textContent = 'Reading ' + ev.url;
        if (!spider.at) { spider.at = n; spider.x = n.x; spider.y = n.y; }
        else if (spider.at !== n) spider.path = route(spider.at, n);
        break;
      }
      case 'visit': {
        const n = addNode(ev.url, null, ev.depth);
        n.state = ev.status >= 400 ? 'error' : 'done';
        n.data = ev; n.pulse = now;
        stats.pages++; if (ev.status >= 400) stats.errors++;
        recent.push(n); if (recent.length > 7) recent.shift();
        spider.scanning = n; spider.wait = now + 450 / (1 + backlog() * 0.8);
        addCard(ev, ev.status >= 400 ? 'err' : '');
        break;
      }
      case 'error': {
        const n = addNode(ev.url, null, 0); n.state = 'error'; n.data = ev; n.pulse = now;
        stats.errors++; addCard(ev, 'err'); break;
      }
      case 'skip': {
        const n = addNode(ev.url, null, 0); n.state = 'skip'; n.data = ev;
        addCard(ev, 'skip'); break;
      }
      case 'done':
        finished = true; tEnd = performance.now();
        $('side').classList.add('done');
        $('status').textContent = ev.stopped ? 'Stopped' : 'Crawl complete';
        $('now').textContent = `Saved ${ev.pages} pages to ${ev.out}`;
        es.close();
        break;
    }
  }

  // ---------- feed ----------
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clip = (s, n) => (s = String(s ?? '')).length > n ? s.slice(0, n) + '…' : s;
  function addCard(ev, kind) {
    const feed = $('feed');
    const empty = feed.querySelector('.empty'); if (empty) empty.remove();
    const d = document.createElement('div');
    d.className = 'entry ' + kind;
    let html;
    if (ev.type === 'visit') {
      const num = v => Number(v ?? 0).toLocaleString();
      html = `<h3 class="t">${esc(ev.title || 'Untitled page')}</h3><div class="u">${esc(ev.url)}</div>
        <div class="m"><span${ev.status >= 400 ? ' class="bad"' : ''}>HTTP <b>${ev.status}</b></span>
        <span><b>${num(ev.word_count)}</b> words</span><span><b>${num(ev.links)}</b> links</span>
        <span><b>${num(ev.images)}</b> images</span><span>depth <b>${ev.depth}</b></span></div>`;
      const rows = [];
      if (ev.h1 && ev.h1.length && ev.h1[0] !== ev.title) rows.push(['h1', clip(ev.h1.join(' / '), 140)]);
      if (ev.description) rows.push(['description', clip(ev.description, 160)]);
      for (const [k, v] of Object.entries(ev.fields || {})) {
        const val = Array.isArray(v) ? `${v.length} found: ${v.slice(0, 3).join(', ')}` : v;
        rows.push([k, clip(val, 220)]);
      }
      if (rows.length) html += `<dl class="fields">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
    } else {
      html = `<h3 class="t">${ev.type === 'error' ? 'Couldn\u2019t read this page' : 'Skipped'}</h3><div class="u">${esc(ev.url)}</div>
        <div class="why">${esc(clip(ev.error || ev.reason, 160))}</div>`;
    }
    d.innerHTML = html;
    feed.prepend(d);
    while (feed.children.length > 150) feed.lastChild.remove();
  }

  // ---------- physics & camera ----------
  function physics() {
    const k = list.length;
    for (let i = 0; i < k; i++) {
      const a = list[i];
      for (let j = i + 1; j < k; j++) {
        const b = list[j];
        let dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 90000) continue;
        const d = Math.sqrt(d2), f = 700 / d2; dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    for (const e of edges) {
      let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y; const d = Math.hypot(dx, dy) || 1;
      const L = e.b.state === 'queued' ? 42 : 85, f = (d - L) * 0.02; dx /= d; dy /= d;
      e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
    }
    for (const n of list) {
      n.vx -= n.x * 0.0006; n.vy -= n.y * 0.0006;
      n.vx *= 0.8; n.vy *= 0.8;
      const v = Math.hypot(n.vx, n.vy); if (v > 8) { n.vx *= 8 / v; n.vy *= 8 / v; }
      n.x += n.vx; n.y += n.vy;
    }
  }

  function updateCamera() {
    if (!list.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of list) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
    const s = Math.max(0.15, Math.min(2.2, (W - 140) / Math.max(x1 - x0, 1), (H - 140) / Math.max(y1 - y0, 1)));
    cam.x += ((x0 + x1) / 2 - cam.x) * 0.05; cam.y += ((y0 + y1) / 2 - cam.y) * 0.05; cam.s += (s - cam.s) * 0.04;
  }
  const sx = x => (x - cam.x) * cam.s + W / 2, sy = y => (y - cam.y) * cam.s + H / 2;

  // ---------- spider movement ----------
  function moveSpider(dt) {
    if (spider.path.length) {
      const t = spider.path[0], dx = t.x - spider.x, dy = t.y - spider.y, d = Math.hypot(dx, dy);
      const bl = backlog();
      const step = 190 * (1 + bl * 0.6) * dt / cam.s;
      let da = Math.atan2(dy, dx) - spider.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      spider.ang += da * 0.25;
      spider.phase += dt * 20 * (1 + bl * 0.3);
      if (d <= step) {
        const prev = spider.at;
        if (prev && t.parent === prev && t.edge) t.edge.walked = true;
        else if (prev && prev.parent === t && prev.edge) prev.edge.walked = true;
        spider.at = t; spider.x = t.x; spider.y = t.y; spider.path.shift();
      } else { spider.x += dx / d * step; spider.y += dy / d * step; }
    } else if (spider.at) {
      spider.x = spider.at.x; spider.y = spider.at.y; spider.phase += dt * 3;
    }
  }

  // ---------- drawing ----------
  function nodeRadius(n) {
    if (n.state === 'queued') return 2.5;
    if (n.state === 'fetching') return 6;
    if (n.state === 'done') return 4 + Math.min(6, Math.log10((n.data?.word_count || 0) + 1) * 2);
    return 4.5;
  }
  const nodeColor = n => ({ done: COL.ok, fetching: COL.accent, error: COL.err, skip: COL.skip }[n.state] || COL.silk);

  // a bead of dew: soft halo, lit from the upper left, with a refracted glint low on the right
  function drawDew(x, y, r, c) {
    ctx.fillStyle = c; ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.05, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.32, c); g.addColorStop(1, c);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(20, 22, 50, .35)'; ctx.lineWidth = 1; ctx.stroke();
    if (r > 4) {
      ctx.strokeStyle = 'rgba(255, 255, 255, .45)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r * 0.66, Math.PI * 0.1, Math.PI * 0.55); ctx.stroke();
    }
  }

  function drawSpider(x, y, ang, phase, moving, glow) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(1.15, 1.15);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const swing = moving ? Math.sin(phase + i * Math.PI / 2 + (side > 0 ? Math.PI : 0)) * 0.32
                             : Math.sin(phase * 0.6 + i * 1.7) * 0.04;
        const th = side * (0.55 + i * 0.55 + swing);
        const ax = 3 - i * 1.6, ay = side * 1.5;
        const kx = ax + Math.cos(th) * 8, ky = ay + Math.sin(th) * 8;
        const fth = th + side * (i < 2 ? -0.65 : 0.65);
        const fx = kx + Math.cos(fth) * 9, fy = ky + Math.sin(fth) * 9;
        ctx.strokeStyle = COL.silk; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      }
    }
    if (glow) { ctx.shadowColor = COL.accent; ctx.shadowBlur = 16; }
    ctx.fillStyle = '#121530'; ctx.strokeStyle = COL.silk; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-7, 0, 7.5, 5.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = COL.accent;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-7, -2.2); ctx.lineTo(-4, 0); ctx.lineTo(-7, 2.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#121530';
    ctx.beginPath(); ctx.arc(2.5, 0, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = COL.err;
    for (const e of [-1.5, 1.5]) { ctx.beginPath(); ctx.arc(5.4, e, 0.95, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function draw(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // threads
    for (const e of edges) {
      const t = Math.min(1, (now - e.b.born) / 450);
      const ax = sx(e.a.x), ay = sy(e.a.y), bx = sx(e.b.x), by = sy(e.b.y);
      const cx = (ax + bx) / 2, cy = (ay + by) / 2 + Math.hypot(bx - ax, by - ay) * 0.12;
      const u = 1 - t;
      const ex = u * u * ax + 2 * u * t * cx + t * t * bx, ey = u * u * ay + 2 * u * t * cy + t * t * by;
      ctx.strokeStyle = COL.silk;
      ctx.globalAlpha = e.walked ? 0.6 : e.b.state === 'queued' ? 0.12 : 0.28;
      ctx.lineWidth = e.walked ? 1.3 : 0.9;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(ax + (cx - ax) * t, ay + (cy - ay) * t, ex, ey); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // dragline behind a moving spider
    if (spider.path.length && spider.at) {
      ctx.strokeStyle = COL.silk; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(sx(spider.at.x), sy(spider.at.y)); ctx.lineTo(sx(spider.x), sy(spider.y)); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // nodes
    for (const n of list) {
      if (n.parent && now - n.born < 450) continue;
      const x = sx(n.x), y = sy(n.y), r = nodeRadius(n), c = nodeColor(n);
      if (n.state === 'fetching') {
        const g = 0.5 + 0.5 * Math.sin(now / 160);
        ctx.fillStyle = c; ctx.globalAlpha = 0.18 + 0.2 * g;
        ctx.beginPath(); ctx.arc(x, y, r + 6 + 4 * g, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      }
      if (n.pulse && now - n.pulse < 1000) {
        const a = (now - n.pulse) / 1000;
        ctx.strokeStyle = c; ctx.globalAlpha = 1 - a; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + a * 26, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (n.state === 'queued') {
        ctx.strokeStyle = COL.silk; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
      } else if (n.state === 'skip') {
        ctx.fillStyle = c; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      } else {
        drawDew(x, y, r, c);
      }
    }

    // scanning ring while extracting
    if (spider.wait > now && spider.scanning) {
      const n = spider.scanning, x = sx(n.x), y = sy(n.y);
      ctx.save(); ctx.strokeStyle = COL.accent; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
      ctx.lineDashOffset = -now / 25;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    // labels for the latest pages and the hovered node
    ctx.font = '500 12px "Alegreya Sans", "Segoe UI", system-ui, sans-serif'; ctx.textBaseline = 'middle';
    const labelled = new Set(recent); if (hover) labelled.add(hover);
    for (const n of labelled) {
      if (!n.data) continue;
      const text = clip(n.data.title || n.url, 34), x = sx(n.x) + nodeRadius(n) + 6, y = sy(n.y);
      ctx.fillStyle = 'rgba(22, 27, 56, .78)';
      ctx.beginPath(); ctx.roundRect(x - 5, y - 9, ctx.measureText(text).width + 10, 18, 9); ctx.fill();
      ctx.fillStyle = n === hover ? '#fff' : COL.muted; ctx.fillText(text, x, y + 0.5);
    }

    if (spider.at) drawSpider(sx(spider.x), sy(spider.y), spider.ang, spider.phase, spider.path.length > 0, spider.wait > now);
  }

  // ---------- hover tooltip ----------
  let hover = null;
  const tip = $('tip');
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    hover = null; let best = 144;
    for (const n of list) { const d = (sx(n.x) - mx) ** 2 + (sy(n.y) - my) ** 2; if (d < best) { best = d; hover = n; } }
    if (!hover) { tip.style.display = 'none'; return; }
    const d = hover.data;
    tip.innerHTML = `<b>${esc(d?.title || ({ queued: 'Queued', fetching: 'Fetching now', skip: 'Skipped', error: 'Error' }[hover.state] || hover.state))}</b><span>${esc(hover.url)}</span>` +
      (d && d.type === 'visit' ? `<em>HTTP ${d.status}, ${Number(d.word_count).toLocaleString()} words, ${d.links} links, depth ${d.depth}</em>` : '') +
      (d && (d.error || d.reason) ? `<em>${esc(clip(d.error || d.reason, 120))}</em>` : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(mx + 14, W - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.min(my + 14, H - tip.offsetHeight - 8) + 'px';
  });
  cv.addEventListener('mouseleave', () => { hover = null; tip.style.display = 'none'; });

  // ---------- loop ----------
  let last = performance.now();
  function step(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    pump(now); physics(); updateCamera(); moveSpider(dt); draw(now);
    let q = 0; for (const n of list) if (n.state === 'queued') q++;
    $('sPages').textContent = stats.pages; $('sQueued').textContent = q; $('sErrors').textContent = stats.errors;
    $('sErrBox').classList.toggle('zero', stats.errors === 0);
    if (t0 !== null) {
      const sec = Math.round(((tEnd ?? now) - t0) / 1000);
      $('sTime').textContent = sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm ' + String(sec % 60).padStart(2, '0') + 's';
    }
  }
  function raf(now) { step(now); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
  // Fallback when the browser throttles animation frames (e.g. background tab)
  setInterval(() => { const now = performance.now(); if (now - last > 200) step(now); }, 50);
})();
</script>
</body>
</html>
